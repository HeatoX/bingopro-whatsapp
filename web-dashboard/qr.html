<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingoPro | Conectar WhatsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A0A14 0%, #1A1A2E 50%, #0F0F1A 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 40px 50px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 95%;
        }
        .logo { font-size: 56px; margin-bottom: 8px; }
        h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        h2 { font-size: 16px; color: #A0A0B8; font-weight: 400; margin-bottom: 30px; }
        #qr-box {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            display: inline-block;
            margin-bottom: 24px;
            min-width: 280px;
            min-height: 280px;
            position: relative;
        }
        #qr-box img { width: 260px; height: 260px; border-radius: 8px; display: block; }
        #loading {
            width: 260px; height: 260px;
            display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 14px;
        }
        #connected-box {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10B981;
            border-radius: 16px;
            padding: 40px 30px;
            margin-bottom: 24px;
        }
        #connected-box .check { font-size: 64px; margin-bottom: 12px; }
        #connected-box p { color: #10B981; font-size: 20px; font-weight: 600; }
        .instructions { color: #A0A0B8; font-size: 14px; line-height: 1.6; }
        .instructions strong { color: #FFD700; }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-bar {
            margin-top: 20px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }
        .btn-admin {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎱</div>
        <h1>BingoPro</h1>
        <h2>Conectar WhatsApp</h2>

        <div id="qr-box">
            <div id="loading" class="pulse">⏳ Generando código QR...</div>
            <img id="qr-img" style="display:none" alt="QR Code" />
        </div>

        <div id="connected-box">
            <div class="check">✅</div>
            <p>WhatsApp Conectado</p>
        </div>

        <div class="instructions">
            <p>1. Abre <strong>WhatsApp</strong> en tu teléfono</p>
            <p>2. Ve a <strong>Dispositivos vinculados</strong></p>
            <p>3. Toca <strong>Vincular dispositivo</strong></p>
            <p>4. Apunta la cámara al código QR</p>
        </div>

        <div class="status-bar" id="status">Conectando...</div>

        <a href="/" class="btn-admin">🖥️ Ir al Panel Admin</a>
    </div>

    <script>
        const qrImg = document.getElementById('qr-img');
        const loading = document.getElementById('loading');
        const qrBox = document.getElementById('qr-box');
        const connBox = document.getElementById('connected-box');
        const statusEl = document.getElementById('status');

        async function poll() {
            try {
                const res = await fetch('/api/qr');
                const data = await res.json();

                if (data.connected) {
                    qrBox.style.display = 'none';
                    connBox.style.display = 'block';
                    statusEl.textContent = '🟢 WhatsApp conectado y funcionando';
                    statusEl.style.color = '#10B981';
                } else if (data.qr) {
                    qrBox.style.display = 'inline-block';
                    connBox.style.display = 'none';
                    qrImg.src = data.qr;
                    qrImg.style.display = 'block';
                    loading.style.display = 'none';
                    statusEl.textContent = '🟡 Esperando escaneo del QR...';
                    statusEl.style.color = '#F59E0B';
                } else {
                    loading.style.display = 'flex';
                    qrImg.style.display = 'none';
                    statusEl.textContent = '⏳ Generando nuevo QR...';
                    statusEl.style.color = '#666';
                }
            } catch {
                statusEl.textContent = '🔴 Error de conexión con el servidor';
                statusEl.style.color = '#EF4444';
            }
            setTimeout(poll, 3000);
        }
        poll();
    </script>
</body>
</html>
